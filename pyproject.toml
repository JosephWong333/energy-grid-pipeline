[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-grid-pipeline"
version = "0.1.0"
description = "Hourly US power-grid analytics: EIA-930 API -> DuckDB -> dbt"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "duckdb>=1.1,<2",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9,<2",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6.0,<7",
    "pandas>=2.1,<3",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
