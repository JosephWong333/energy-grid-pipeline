name: CI

on:
  pull_request:
  push:
    branches: [main]

# CI only reads the repo; the token gets nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GRID_DB_PATH: data/dev_fixtures.duckdb
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps
      - name: Lint (ruff)
        run: ruff check .
      - name: Unit tests (pytest)
        run: pytest
      # Full pipeline verification with ZERO credentials: seeded,
      # API-shaped fixtures flow through the real parse + upsert path, then
      # dbt materializes every model and runs the entire test suite.
      - name: Generate dev fixtures
        run: python scripts/generate_dev_fixtures.py
      - name: Ingest fixtures (real load path)
        run: python -m grid_pipeline.ingest --mode fixtures
      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt
      - name: dbt build (models + all data tests)
        run: dbt build --project-dir dbt --profiles-dir dbt --target ci
      # A fresh build proves nothing about the is_incremental() branch, which
      # is what every scheduled run after deployment actually executes.
      - name: dbt build (incremental path, same warehouse)
        run: dbt build --project-dir dbt --profiles-dir dbt --target ci
      - name: Render charts (smoke test)
        run: python scripts/make_charts.py
      # The publish script otherwise only runs in the nightly. Dry-run both
      # modes here so a broken projection or a renamed column fails the PR,
      # not the next night. No Cloud SDK or credentials needed.
      - name: Publish script (dry run)
        run: |
          python scripts/export_to_cloud.py --mode incremental --dry-run
          python scripts/export_to_cloud.py --mode full --dry-run
