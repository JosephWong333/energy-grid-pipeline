name: Nightly refresh

# Real-data run: incremental ingest from the EIA API into MotherDuck, then
# dbt build against the prod target, publish to GCS + BigQuery, and
# source freshness.
#
# Required repository secrets:
#   EIA_API_KEY       — free key from https://www.eia.gov/opendata/register.php
#   MOTHERDUCK_TOKEN  — from https://motherduck.com (free tier is plenty)
# Each secret is handed only to the steps that use it, so the install step
# and the third-party Google actions never see them.
#
# Required repository variables (not secrets — none of these are sensitive,
# and having them readable in the log is what makes an auth failure debuggable):
#   GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_SERVICE_ACCOUNT
# Optional repository variable:
#   PUBLISH_ENABLED   — set to "false" to skip the Google steps (for example
#                       if the GCP project is shut down); MotherDuck keeps
#                       refreshing and the run stays green.
# Google auth is keyless via Workload Identity Federation. There is no service
# account JSON anywhere in this repo or its secrets.

on:
  schedule:
    - cron: "25 7 * * *"   # daily 07:25 UTC (~00:25 Pacific)
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "BigQuery publish: incremental (lookback window) or full (reseed every partition)"
        type: choice
        options: [incremental, full]
        default: incremental
      dbt_full_refresh:
        description: "Rebuild every dbt model from raw and re-publish all of BigQuery (after seed edits, a new fuel group, fct column changes, or a fuel-currency warning)"
        type: boolean
        default: false
      ingest_source:
        description: "Where the ingest reads: the API (a normal run), or only EIA's bulk file (a drill of the fallback; it adds nothing but rows the warehouse lacks)"
        type: choice
        options: [api, bulk-file]
        default: api

concurrency:
  group: nightly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # A normal night takes ~3 minutes. The budget is for EIA's slow spells:
    # on Nov 25 one pass over the 22 requests ran at over a minute each, and
    # the ingest step may pause and resume four times.
    timeout-minutes: 120

    # id-token: write lets the runner mint the OIDC token that Google exchanges
    # for a short-lived credential. Without it, auth fails on a missing token.
    permissions:
      id-token: write
      contents: read

    env:
      GRID_DB_PATH: "md:energy_grid"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      # EIA's API has slow spells: read timeouts and 504s that can use up
      # every one of the client's tries on a single request. Three nights
      # went red that way (Oct 17, Oct 19, Nov 15). Exit codes 4 and 5 mean
      # "nothing from the failing window was loaded; re-run the same
      # command to resume", so this step does that itself after a pause,
      # up to INGEST_ATTEMPTS runs in total. The checkpoint file is what
      # makes each of those a resume: it lists the (route, BA) pairs
      # already refreshed, and the next attempt fetches only the rest.
      # Before it, every attempt started again at the first pair: on
      # Nov 25 one attempt finished at least 18 of the 22 and the next
      # two, starting over, died sooner. Nothing else is retried: 2 is the
      # contamination guard, 3 means EIA asked for a wait longer than the
      # client's cap (tomorrow's run resumes), and 1 is a crash. A night
      # that needed another attempt stays green and carries a warning
      # annotation, so slow spells stay visible on the run page.
      #
      # When the attempts run out, the last exit code decides the night:
      #   5  EIA's API never answered (timeouts or 5xx on every try). That
      #      is an outage upstream, not a fault in this pipeline. The step
      #      then loads the hours the warehouse lacks from EIA's bulk
      #      file, a copy of the same data on a different server (see
      #      src/grid_pipeline/bulk.py), and ends with a warning that says
      #      what it loaded. If the file cannot help either, the warning
      #      says so and the step still ends green. The build, the publish
      #      and the freshness check run on what the warehouse holds, and
      #      the age of that data is the judge: the build's coverage test
      #      fails once the BAs have fewer than 20 usable hours in the
      #      last 72 (a little over two days with nothing new), and source
      #      freshness has its own error threshold. On Nov 26-27 the API
      #      answered none of 105 tries in three 49-minute runs, and each
      #      went red at this step.
      #   4  EIA said no or sent something wrong. The night fails here.
      #
      # ingest_source=bulk-file (manual runs only) is the drill: it skips
      # the API and runs just the fallback, and fails if the fallback does.
      - name: Incremental ingest (EIA API -> MotherDuck)
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          INGEST_ATTEMPTS: "5"
          INGEST_RETRY_WAIT_SECONDS: "300"
          INGEST_SOURCE: ${{ inputs.ingest_source || 'api' }}
        run: |
          if [ "$INGEST_SOURCE" = "bulk-file" ]; then
            summary=$(python -m grid_pipeline.ingest --mode fallback)
            echo "::notice title=Bulk file drill::$summary"
            exit 0
          fi
          attempt=1
          while true; do
            code=0
            python -m grid_pipeline.ingest --mode incremental --checkpoint "$RUNNER_TEMP/ingest-checkpoint" || code=$?
            if [ "$code" -ne 4 ] && [ "$code" -ne 5 ]; then
              exit "$code"
            fi
            if [ "$attempt" -ge "$INGEST_ATTEMPTS" ]; then
              break
            fi
            echo "::warning title=Ingest resumed::Attempt $attempt of $INGEST_ATTEMPTS exited $code (resumable EIA error). Resuming in ${INGEST_RETRY_WAIT_SECONDS}s."
            sleep "$INGEST_RETRY_WAIT_SECONDS"
            attempt=$((attempt + 1))
          done
          if [ "$code" -eq 5 ]; then
            fallback=0
            summary=$(python -m grid_pipeline.ingest --mode fallback) || fallback=$?
            if [ "$fallback" -eq 0 ]; then
              echo "::warning title=EIA API silent - bulk file used::EIA's API did not answer in $INGEST_ATTEMPTS attempts. $summary"
            else
              echo "::warning title=EIA API silent - no new data::EIA's API did not answer in $INGEST_ATTEMPTS attempts and the bulk file could not fill in (exit code $fallback), so tonight's data is missing or incomplete. The build, the publish and the freshness check still run on what the warehouse holds, and the night fails only if that data is too old for the coverage test or the freshness check."
            fi
            exit 0
          fi
          exit "$code"

      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt

      - name: dbt build (prod)
        id: build
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          FULL_REFRESH_FLAG: ${{ inputs.dbt_full_refresh && '--full-refresh' || '' }}
        run: >-
          dbt build --project-dir dbt --profiles-dir dbt --target prod
          --vars '{expect_full_history: true}' $FULL_REFRESH_FLAG

      # --- serving layer -------------------------------------------------
      # Publishing runs BEFORE source freshness on purpose. Freshness failing
      # means EIA has not published yet upstream; it does not mean the marts
      # are wrong. Gating the publish on it would let a quiet upstream day
      # silently freeze BigQuery while the warehouse was perfectly fine.

      - name: Authenticate to Google Cloud (keyless)
        if: ${{ vars.PUBLISH_ENABLED != 'false' }}
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        if: ${{ vars.PUBLISH_ENABLED != 'false' }}

      # `full` is the recovery lever, never the schedule. The incremental
      # window is 5 days, so an outage longer than that would leave a hole in
      # BigQuery that no later incremental run would ever revisit. Reseeding
      # is one dispatch rather than a manual backfill script.
      - name: Publish marts to GCS + BigQuery
        if: ${{ vars.PUBLISH_ENABLED != 'false' }}
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCS_BUCKET: eia-grid-930-marts
          BQ_DATASET: energy_grid
          # A full dbt rebuild can change any day, so it always publishes in full.
          PUBLISH_MODE: ${{ inputs.dbt_full_refresh && 'full' || inputs.publish_mode || 'incremental' }}
        run: python scripts/export_to_cloud.py --mode "$PUBLISH_MODE"

      # Runs whenever the warehouse build succeeded, even if the publish
      # failed or is switched off: it reports on the data, not the publish.
      - name: Source freshness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: dbt source freshness --project-dir dbt --profiles-dir dbt --target prod
